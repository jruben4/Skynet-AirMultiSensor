substitutions:
  devicename: skynet-multisensor
  upper_devicename: SkynetMultiSensor

  # ---- thresholds: moderate / high ----
  temp_mod_f:   "80"    # °F
  temp_high_f:  "90"
  temp_mod_c:   "26"    # °C
  temp_high_c:  "32"
  rh_mod:     "60"      # %
  rh_high:    "70"
  ah_mod:     "12"      # g/m³
  ah_high:    "17"
  co2_mod:    "1000"    # ppm
  co2_high:   "1500"

  pm1_mod:    "12"      # µg/m³
  pm1_high:   "35"
  pm25_mod:   "12"      # EPA AQI good/moderate boundary
  pm25_high:  "35"      # unhealthy for sensitive groups
  pm4_mod:    "25"
  pm4_high:   "50"
  pm10_mod:   "54"      # EPA AQI breakpoints
  pm10_high:  "154"

  voc_mod:    "150"     # Sensirion index, 100 = baseline
  voc_high:   "250"
  nox_mod:    "20"      # index, 1 = clean
  nox_high:   "150"

  no2_mod:    "0.05"    # ppm
  no2_high:   "0.10"
  co_mod:     "9"       # ppm, EPA 8h standard
  co_high:    "35"      # EPA 1h standard
  h2_mod:     "50"
  h2_high:    "100"
  etoh_mod:   "50"
  etoh_high:  "100"
  ch4_mod:    "1000"    # ppm, ~2% of LEL
  ch4_high:   "5000"    # ~10% of LEL
  nh3_mod:    "25"      # NIOSH REL
  nh3_high:   "50"      # OSHA PEL

  # ---- self-heating corrections ----
  #  Defaults, in DEGREES CELSIUS, for the three "Bias ..." number entities.
  #  After the first flash the live values come from Home Assistant and are
  #  restored across reboots, so editing these has no effect on a running
  #  device unless you also change the number in HA.
  #
  #  The numbers are expressed in whatever unit the Display Fahrenheit
  #  switch selects. Because a bias is a temperature DIFFERENCE, the
  #  conversion is x1.8 only - there is no +32 term. Flipping the switch
  #  rescales the stored values so the physical correction is unchanged.
  #
  #  All three are applied as ESPHome filters (x - bias) rather than in the
  #  sensors' own offset registers, because those registers are written once
  #  at setup() and cannot be changed at runtime.
  bias_dht:  "4.81"
  bias_scd:  "3.39"
  bias_sen:  "5"
  # Range must cover both units: +-20 C is about +-36 F.
  bias_min:  "-20"
  bias_max:  "40"
  # ---- 1-sigma (°C). Datasheet "typ. accuracy" treated as 2-sigma. ----
  sigma_dht: "0.25"
  sigma_scd: "0.40"
  sigma_sen: "0.225"
  outlier_k: "3.0"     # residual gate, in sigmas

  # ---- residual RH bias (%RH), from salt calibration. Usually 0. ----
  rhbias_dht: "0.0"
  rhbias_scd: "0.0"
  rhbias_sen: "0.0"
  # ---- 1-sigma (%RH) ----
  sigma_dht_rh: "1.75"   # spec ±2 inflated to ±3.5; use 1.0 if verified
  sigma_scd_rh: "3.00"
  sigma_sen_rh: "2.25"
  rh_outlier_k: "3.0"

  # ---- SCD41 CO2 calibration ----
  #  ASC assumes the sensor sees a ~400 ppm background at least weekly.
  #  In a room that never fully vents that assumption fails silently and
  #  drags the baseline. Set scd_asc to "false" if this unit lives in
  #  such a room, and use the forced-calibration button instead.
  scd_asc:   "true"
  fcal_ppm:  "420"       # outdoor reference for forced recalibration
  cal_arm_timeout: "5min"   # arm switch auto-disarms after this

  # ---- cold-start capture ----
  boot_poll_ms:    "10000"    # fast poll rate until boot temps latch
  boot_timeout_tk: "150"      # give up after N x 2s ticks (150 = 5 min)
  warm_delay_ms:   "1800000"  # steady-state sample at 30 min uptime
  scd_min_ms:      "10000"    # never poll the SCD41 faster than this
  # Stale-data guard. Must exceed the largest Sensor Update Seconds (600s),
  # or sensors would go NaN between normal updates.
  stale_timeout:   "15min"

esphome:
  name: $devicename
  friendly_name: $upper_devicename

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #use_address: 192.168.5.51
  min_auth_mode: WPA2
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${upper_devicename} Hotspot
    password: !secret master_skynet_multisensor__ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret master_skynet_multisensor__ota_password

# Enable logging
logger:

# Enable debug
debug:
  update_interval: 60s

# Enable Home Assistant API
api:
  encryption:
    key: !secret master_skynet_multisensor__encryption_key
  actions:
    - action: set_ambient_pressure
      variables:
        pressure_mbar: int
      then:
        - lambda: |-
            id(my_scd41)->set_ambient_pressure_compensation(pressure_mbar);
            id(last_pressure) = (float) pressure_mbar;
            id(last_pressure_ms) = millis();
            ESP_LOGI("pressure", "Ambient pressure set to %d mbar", (int) pressure_mbar);

  reboot_timeout: 0s
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 100ms     # ~31% duty
    active: false

bluetooth_proxy:
  active: true
  connection_slots: 1

globals:
  - { id: is_power_on_boot, type: bool, restore_value: no, initial_value: 'false' }
  - id: page_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: tick
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: force_redraw
    type: bool
    restore_value: no
    initial_value: 'false'
  # 0 = All 16, 1 = Rotating, 2 = Highlight
  - id: mode_index
    type: int
    restore_value: no
    initial_value: '0'
  # set true to re-apply sensor update intervals on the next loop pass
  - id: apply_intervals
    type: bool
    restore_value: no
    initial_value: 'true'
  # Unit the three Bias numbers are CURRENTLY stored in. false = delta C.
  # Persisted so a reboot never triggers a spurious rescale. Everything
  # that reads a bias uses this, not the switch, so there is no window
  # where the two disagree.
  - { id: bias_unit_f, type: bool, restore_value: yes, initial_value: 'false' }
  - { id: g_sigma, type: float, restore_value: no, initial_value: '0' }
  - { id: g_chi2,  type: float, restore_value: no, initial_value: '0' }
  - { id: g_n,     type: int,   restore_value: no, initial_value: '0' }
  # ---- first temperature reading after boot, latched once, never restored ----
  - { id: first_dht, type: float, restore_value: no, initial_value: 'NAN' }
  - { id: first_scd, type: float, restore_value: no, initial_value: 'NAN' }
  - { id: first_sen, type: float, restore_value: no, initial_value: 'NAN' }
  # ---- steady-state temperature sampled at warm_delay_ms uptime ----
  - { id: warm_dht, type: float, restore_value: no, initial_value: 'NAN' }
  - { id: warm_scd, type: float, restore_value: no, initial_value: 'NAN' }
  - { id: warm_sen, type: float, restore_value: no, initial_value: 'NAN' }
  - { id: warm_latched, type: bool, restore_value: no, initial_value: 'false' }
  # ---- cold-start fast-poll phase ----
  - { id: boot_fast_applied, type: bool,     restore_value: no, initial_value: 'false' }
  - { id: boot_fast_done,    type: bool,     restore_value: no, initial_value: 'false' }
  - { id: boot_ticks,        type: uint32_t, restore_value: no, initial_value: '0' }
  # ---- last ambient pressure pushed in via the API action ----
  - { id: last_pressure,    type: float,    restore_value: no, initial_value: 'NAN' }
  - { id: last_pressure_ms, type: uint32_t, restore_value: no, initial_value: '0' }
  # ---- Humidity values
  - { id: g_rh_sigma, type: float, restore_value: no, initial_value: '0' }
  - { id: g_rh_chi2,  type: float, restore_value: no, initial_value: '0' }
  - { id: g_rh_n,     type: int,   restore_value: no, initial_value: '0' }

switch:
  - platform: restart
    name: ${upper_devicename} Restart

  - platform: template
    name: "${upper_devicename} Display Fahrenheit"
    id: use_fahrenheit
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    # NOTE: fires during setup(), before the display buffer exists.
    # Only touch globals here. The bias rescale is handled by an interval
    # so it can never run against half-restored state.
    on_turn_on:
      - lambda: |-
          id(force_redraw) = true;
    on_turn_off:
      - lambda: |-
          id(force_redraw) = true;

  # Safety interlock for the forced CO2 calibration. Must be ON before the
  # calibration button will do anything. Auto-disarms after cal_arm_timeout
  # and never survives a reboot, so it cannot be left armed by accident.
  - platform: template
    name: "${upper_devicename} Arm CO2 Calibration"
    id: cal_armed
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: "config"
    icon: "mdi:lock-open-variant"
    on_turn_on:
      - logger.log:
          level: WARN
          format: "CO2 forced calibration ARMED - disarms in ${cal_arm_timeout}"
      - delay: ${cal_arm_timeout}
      - switch.turn_off: cal_armed
    on_turn_off:
      - logger.log: "CO2 forced calibration disarmed"

button:
  # Manual fan autoclean for the SEN55. The optical chamber loads with dust
  # over months; the fan spins up to ~10s at full speed to blow it clear.
  - platform: template
    name: "${upper_devicename} Clean SEN55 Fan"
    id: sen55_fan_clean
    entity_category: config
    icon: "mdi:fan"
    on_press:
      - logger.log: "SEN55 manual fan autoclean started"
      - sen5x.start_fan_autoclean: sen55

  # Forced recalibration of the SCD41 CO2 baseline.
  #  PROCEDURE: take the unit outdoors (or to a well-ventilated space),
  #  leave it powered and measuring for at least 3 minutes so the reading
  #  stabilises, turn ON "Arm CO2 Calibration", THEN press this.
  #  It overwrites the stored baseline with fcal_ppm. Pressing it indoors
  #  will corrupt the calibration.
  - platform: template
    name: "${upper_devicename} Force CO2 Calibration"
    id: scd41_force_cal
    entity_category: config
    icon: "mdi:target"
    on_press:
      - if:
          condition:
            switch.is_on: cal_armed
          then:
            - logger.log:
                format: "SCD41 forced recalibration to %d ppm - hope you are outside"
                args: ['${fcal_ppm}']
            - scd4x.perform_forced_calibration:
                value: ${fcal_ppm}
                id: my_scd41
            - switch.turn_off: cal_armed
          else:
            - logger.log:
                level: WARN
                format: "Forced calibration IGNORED - arm it first"

select:
  - platform: template
    name: "${upper_devicename} Display Mode"
    id: display_mode
    optimistic: true
    restore_value: true
    initial_option: "All 16"
    options:
      - "All 16"        # dense single page, 16 values
      - "Rotating"      # 4 pages of 4, auto-advancing
      - "Highlight"     # static page: temp / VOC / CO2 / PM2.5
    # NOTE: fires during setup(), before the display buffer exists.
    # Never touch the display here - just flag it for the interval.
    on_value:
      - lambda: |-
          if (x == "Rotating") {
            id(mode_index) = 1;
          } else if (x == "Highlight") {
            id(mode_index) = 2;
          } else {
            id(mode_index) = 0;
          }
          id(page_index) = 0;
          id(tick) = 0;
          id(force_redraw) = true;

number:
  - platform: template
    name: "${upper_devicename} Display Rotate Seconds"
    id: rotate_seconds
    optimistic: true
    restore_value: true
    initial_value: 8
    min_value: 2
    max_value: 60
    step: 1
    unit_of_measurement: "s"
    mode: slider
    entity_category: "config"

  - platform: template
    name: "${upper_devicename} Sensor Update Seconds"
    id: sensor_update_seconds
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 10
    max_value: 600
    step: 5
    unit_of_measurement: "s"
    mode: box
    entity_category: "config"
    # NOTE: fires during setup(), before pollers are running.
    # Defer the actual re-poll to the interval below.
    on_value:
      - lambda: |-
          id(apply_intervals) = true;

  # ---- live self-heating corrections ----
  #  Expressed in the unit the Display Fahrenheit switch selects, as a
  #  DELTA (x1.8, no +32). Read on every sensor publish, so a change takes
  #  effect on the next poll - no reflash, no reboot.
  - platform: template
    name: "${upper_devicename} Bias DHT22"
    id: bias_dht_num
    optimistic: true
    restore_value: true
    initial_value: ${bias_dht}
    min_value: ${bias_min}
    max_value: ${bias_max}
    step: 0.01
    unit_of_measurement: "°"
    mode: box
    entity_category: "config"
    icon: "mdi:thermometer-lines"
    on_value:
      - lambda: |-
          id(force_redraw) = true;

  - platform: template
    name: "${upper_devicename} Bias SCD41"
    id: bias_scd_num
    optimistic: true
    restore_value: true
    initial_value: ${bias_scd}
    min_value: ${bias_min}
    max_value: ${bias_max}
    step: 0.01
    unit_of_measurement: "°"
    mode: box
    entity_category: "config"
    icon: "mdi:thermometer-lines"
    on_value:
      - lambda: |-
          id(force_redraw) = true;

  - platform: template
    name: "${upper_devicename} Bias SEN55"
    id: bias_sen_num
    optimistic: true
    restore_value: true
    initial_value: ${bias_sen}
    min_value: ${bias_min}
    max_value: ${bias_max}
    step: 0.01
    unit_of_measurement: "°"
    mode: box
    entity_category: "config"
    icon: "mdi:thermometer-lines"
    on_value:
      - lambda: |-
          id(force_redraw) = true;

interval:
  # ---- keep the Bias numbers in the display's unit ----
  #  Runs only from the main loop, so it never sees half-restored state.
  #  A bias is a temperature DIFFERENCE: convert with x1.8 only, no +32.
  - interval: 2s
    then:
      - lambda: |-
          const bool want_f = id(use_fahrenheit).state;
          if (want_f == id(bias_unit_f)) {
            return;
          }
          const float k = want_f ? 1.8f : (1.0f / 1.8f);
          auto rescale = [&](esphome::number::Number *n) {
            if (n == nullptr || std::isnan(n->state)) return;
            auto call = n->make_call();
            call.set_value(n->state * k);
            call.perform();
          };
          rescale(id(bias_dht_num));
          rescale(id(bias_scd_num));
          rescale(id(bias_sen_num));
          id(bias_unit_f) = want_f;
          id(force_redraw) = true;
          ESP_LOGI("bias", "Bias numbers rescaled to delta %s", want_f ? "F" : "C");

  # ---- sensor poll-rate manager ----
  #  Phase 1: poll fast (boot_poll_ms) until all three boot temps latch.
  #  Phase 2: switch to the user-selected Sensor Update Seconds.
  - interval: 2s
    then:
      - lambda: |-
          auto apply = [&](esphome::PollingComponent *c, uint32_t ms) {
            if (c == nullptr || !c->is_ready()) return;
            c->stop_poller();
            c->set_update_interval(ms);
            c->start_poller();
          };
          auto apply_all = [&](uint32_t ms) {
            // The SCD41 in single_shot needs >5s per measurement, so it
            // gets its own floor regardless of the requested rate.
            const uint32_t scd_ms = (ms < (uint32_t) ${scd_min_ms})
                                  ? (uint32_t) ${scd_min_ms} : ms;
            apply(id(dht22), ms);
            apply(id(my_scd41), scd_ms);
            apply(id(sen55), ms);
            apply(id(mics), ms);
            apply(id(wifi_signal_db), ms);
            // derived / fused
            apply(id(temp_fused), ms);
            apply(id(temp_fused_sigma), ms);
            apply(id(temp_fused_chi2), ms);
            apply(id(rh_fused), ms);
            apply(id(rh_fused_sigma), ms);
            apply(id(rh_fused_chi2), ms);
            apply(id(abs_humidity), ms);
            apply(id(dew_point), ms);
          };

          // ---------- Phase 1: cold-start fast polling ----------
          if (!id(boot_fast_done)) {
            if (!id(boot_fast_applied)) {
              // wait until the three temperature owners exist, then set fast rate once
              if (!(id(dht22).is_ready() && id(my_scd41).is_ready() && id(sen55).is_ready())) {
                return;
              }
              id(boot_fast_applied) = true;
              apply_all(${boot_poll_ms});
              ESP_LOGI("intervals", "Cold start: polling at %u ms until boot temps latch",
                       (unsigned) ${boot_poll_ms});
              return;
            }

            id(boot_ticks)++;
            bool all_latched = !std::isnan(id(first_dht))
                            && !std::isnan(id(first_scd))
                            && !std::isnan(id(first_sen));
            if (!all_latched && id(boot_ticks) < ${boot_timeout_tk}) {
              return;
            }
            id(boot_fast_done) = true;
            id(apply_intervals) = true;
            if (all_latched) {
              ESP_LOGI("intervals", "Boot temps latched: DHT %.2f, SCD %.2f, SEN %.2f C",
                       id(first_dht), id(first_scd), id(first_sen));
            } else {
              ESP_LOGW("intervals", "Boot temp capture timed out, using user rate");
            }
          }

          // ---------- Phase 2: user-selected rate ----------
          if (!id(apply_intervals)) {
            return;
          }
          id(apply_intervals) = false;
          uint32_t ms = (uint32_t) (id(sensor_update_seconds).state * 1000.0f);
          if (ms < 5000) ms = 5000;
          apply_all(ms);
          ESP_LOGI("intervals", "Sensor update interval set to %u ms", (unsigned) ms);

  # ---- steady-state (warm) temperature capture, once at warm_delay_ms ----
  - interval: 10s
    then:
      - lambda: |-
          if (id(warm_latched)) {
            return;
          }
          if (millis() < (uint32_t) ${warm_delay_ms}) {
            return;
          }
          if (!(id(Temperature).has_state() && id(scd_temp).has_state()
                && id(sen_temp).has_state())) {
            return;
          }
          id(warm_dht) = id(Temperature).state;
          id(warm_scd) = id(scd_temp).state;
          id(warm_sen) = id(sen_temp).state;
          id(warm_latched) = true;
          ESP_LOGI("warm_temp", "Steady-state temps: DHT %.2f, SCD %.2f, SEN %.2f C",
                   id(warm_dht), id(warm_scd), id(warm_sen));
          ESP_LOGI("warm_temp", "Suggested biases: dht %.2f, scd %.2f, sen %.2f",
                   id(warm_dht) - id(first_dht),
                   id(warm_scd) - id(first_scd),
                   id(warm_sen) - id(first_sen));

  # ---- display page rotation / refresh ----
  - interval: 1s
    then:
      - lambda: |-
          if (!id(my_display).is_ready()) {
            return;
          }
          id(tick)++;
          if (id(force_redraw)) {
            id(force_redraw) = false;
            id(tick) = 0;
            id(my_display).update();
            return;
          }
          if (id(mode_index) == 1) {
            uint32_t period = (uint32_t) id(rotate_seconds).state;
            if (period < 1) period = 1;
            if (id(tick) >= period) {
              id(tick) = 0;
              id(page_index) = (id(page_index) + 1) % 4;
              id(my_display).update();
            }
          } else {
            if (id(tick) >= 10) {
              id(tick) = 0;
              id(my_display).update();
            }
          }

  # ---- WiFi fault indicator ----
  - interval: 5s
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - light.turn_on:
                id: status_rgb
                brightness: 30%
                red: 100%
                green: 0%
                blue: 0%
            - delay: 200ms
            - light.turn_off: status_rgb

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ${upper_devicename} IP Address
    ssid:
      name: ${upper_devicename} Connected SSID
      id: my_ssid
    bssid:
      name: ${upper_devicename} Connected BSSID

  - platform: debug
    reset_reason:
      name: "${upper_devicename} Reset Reason"
      id: reset_reason
      on_value:
        - lambda: |-
            std::string r = x;
            for (auto &c : r) c = (char) tolower(c);
            // "power-on event" (ESPHome 2025.x+) and "Power On Reset" (older)
            // both match; "power glitch detected" is excluded.
            id(is_power_on_boot) = (r.find("power") != std::string::npos)
                                && (r.find("glitch") == std::string::npos);
            ESP_LOGI("boot", "Reset reason '%s' -> bias estimate %s",
                     x.c_str(), id(is_power_on_boot) ? "enabled" : "suppressed");

# Roboto Condensed (SIL OFL) pulled from Google Fonts at build time,
# so no font file is redistributed with this project.
#  Sizes are near the layout limits - see the display lambda for the
#  row pitch each one assumes.
font:
  - file:
      type: gfonts
      family: Roboto Condensed
      weight: 400
    id: font_label
    size: 10
    glyphs: &glyphset "!\"%'()+=,-_.:/°µ³0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz "
  - file:
      type: gfonts
      family: Roboto Condensed
      weight: 700
    id: font_value
    size: 27
    glyphs: *glyphset
  - file:
      type: gfonts
      family: Roboto Condensed
      weight: 400
    id: font_big_label
    size: 22
    glyphs: *glyphset
  - file:
      type: gfonts
      family: Roboto Condensed
      weight: 700
    id: font_big
    size: 46
    glyphs: *glyphset

color:
  - id: c_bg
    hex: "000000"
  - id: c_white
    hex: "FFFFFF"
  - id: c_dim
    hex: "B0BCC8"
  - id: c_dot
    hex: "40505C"
  - id: c_accent
    hex: "18A0C8"
  - id: c_warm
    hex: "F0A030"
  - id: c_green
    hex: "30C060"
  - id: c_yellow
    hex: "E8C020"
  - id: c_red
    hex: "E04030"

i2c:
  - sda: GPIO21
    scl: GPIO22
    scan: True
    id: bus_b
    #SEN55 Bus

  - sda: GPIO26
    scl: GPIO17
    scan: True
    id: bus_a
    #MICS4515/SCD41 Bus

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    id: wifi_signal_pct
    internal: true
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"

  - platform: dht
    id: dht22
    pin: GPIO25
    model: DHT22
    temperature:
      name: "${upper_devicename} DHT22 Temperature"
      id: Temperature
      # Bias comes from the Bias DHT22 number, converted to delta C.
      filters:
        - lambda: |-
            float b = id(bias_dht_num).state;
            if (std::isnan(b)) b = 0.0f;
            if (id(bias_unit_f)) b /= 1.8f;
            return x - b;
        - timeout:
            timeout: ${stale_timeout}
            value: nan
      on_value:
        - lambda: |-
            if (std::isnan(id(first_dht)) && !std::isnan(x)) {
              id(first_dht) = x;
              ESP_LOGI("boot_temp", "DHT22 first reading: %.2f C", x);
            }
    humidity:
      name: "${upper_devicename} DHT22 Humidity"
      id: Humidity
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    update_interval: 60s

  - platform: copy
    source_id: Temperature
    name: "${upper_devicename} DHT22 Temperature F"
    id: temperature_f
    internal: true
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 9.0 / 5.0 + 32.0;

  - platform: scd4x
    id: my_scd41
    i2c_id: bus_a
    update_interval: 60s
    # Offset register left at 0 - the correction is applied by the filter
    # below so it can be changed at runtime. Consequence: the SCD41's own
    # RH output is referred to its self-heated temperature, so rh_fused
    # rescales it (tbias is non-zero for this sensor again).
    temperature_offset: 0°C
    # See the scd_asc note in substitutions - ASC needs a weekly ~400 ppm
    # background to stay honest.
    automatic_self_calibration: ${scd_asc}
    measurement_mode: single_shot
    co2:
      name: "${upper_devicename} CO2"
      id: scd_co2
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    temperature:
      name: "${upper_devicename} SD41 Temperature"
      id: scd_temp
      filters:
        - lambda: |-
            float b = id(bias_scd_num).state;
            if (std::isnan(b)) b = 0.0f;
            if (id(bias_unit_f)) b /= 1.8f;
            return x - b;
        - timeout:
            timeout: ${stale_timeout}
            value: nan
      on_value:
        - lambda: |-
            if (std::isnan(id(first_scd)) && !std::isnan(x)) {
              id(first_scd) = x;
              ESP_LOGI("boot_temp", "SCD41 first reading: %.2f C", x);
            }
    humidity:
      name: "${upper_devicename} SD41 Humidity"
      id: scd_humidity
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan

  - platform: sen5x
    id: sen55
    i2c_id: bus_b
    pm_1_0:
      name: "${upper_devicename} PM <1µm Weight concentration"
      id: pm_1_0
      accuracy_decimals: 1
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    pm_2_5:
      name: "${upper_devicename} PM <2.5µm Weight concentration"
      id: pm_2_5
      accuracy_decimals: 1
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    pm_4_0:
      name: "${upper_devicename} PM <4µm Weight concentration"
      id: pm_4_0
      accuracy_decimals: 1
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    pm_10_0:
      name: "${upper_devicename} PM <10µm Weight concentration"
      id: pm_10_0
      accuracy_decimals: 1
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    temperature:
      name: "${upper_devicename} Sen55 Temperature"
      accuracy_decimals: 1
      id: sen_temp
      filters:
        - lambda: |-
            float b = id(bias_sen_num).state;
            if (std::isnan(b)) b = 0.0f;
            if (id(bias_unit_f)) b /= 1.8f;
            return x - b;
        - timeout:
            timeout: ${stale_timeout}
            value: nan
      on_value:
        - lambda: |-
            if (std::isnan(id(first_sen)) && !std::isnan(x)) {
              id(first_sen) = x;
              ESP_LOGI("boot_temp", "SEN55 first reading: %.2f C", x);
            }
    humidity:
      name: "${upper_devicename} Sen55 Humidity"
      accuracy_decimals: 0
      id: sen_hum
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    nox:
      name: "${upper_devicename} NOx"
      unit_of_measurement: "NOx Index"
      id: sen_nox
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    voc:
      name: "${upper_devicename} VOC"
      unit_of_measurement: "VOC Index"
      id: sen_voc
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
      algorithm_tuning:
        index_offset: 100
        learning_time_offset_hours: 12
        learning_time_gain_hours: 12
        gating_max_duration_minutes: 180
        std_initial: 50
        gain_factor: 230
    # Offset register left at 0 - see the SCD41 note above. The correction
    # is applied by the temperature filter so it stays runtime-adjustable.
    temperature_compensation:
      offset: 0
      normalized_offset_slope: 0
      time_constant: 0
    acceleration_mode: low
    store_baseline: true
    # Optical chamber loads with dust over months; weekly fan spin-up
    # keeps PM readings from drifting low. Also exposed as a button.
    auto_cleaning_interval: 604800s
    address: 0x69
    update_interval: 60s

  - platform: mics_4514
    id: mics
    i2c_id: bus_a
    nitrogen_dioxide:
      name: ${upper_devicename} Nitrogen Dioxide
      id: mics_no2
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    carbon_monoxide:
      name: ${upper_devicename} Carbon Monoxide
      id: mics_co
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    hydrogen:
      name: ${upper_devicename} Hydrogen
      id: mics_h2
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    ethanol:
      name: ${upper_devicename} Ethanol
      id: mics_etoh
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    methane:
      name: ${upper_devicename} Methane
      id: mics_ch4
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    ammonia:
      name: ${upper_devicename} Ammonia
      id: mics_nh3
      filters:
        - timeout:
            timeout: ${stale_timeout}
            value: nan
    update_interval: 60s

  # ---- ambient pressure pushed in from Home Assistant ----
  - platform: template
    name: "${upper_devicename} Ambient Pressure"
    id: ambient_pressure
    lambda: "return id(last_pressure);"
    device_class: atmospheric_pressure
    state_class: measurement
    unit_of_measurement: "mbar"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Pressure Age"
    id: pressure_age
    lambda: |-
      if (id(last_pressure_ms) == 0) return NAN;
      return (float) (millis() - id(last_pressure_ms)) / 60000.0f;
    device_class: duration
    state_class: measurement
    unit_of_measurement: "min"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 60s

  # ---- cold-start reference temperatures (latched at first reading) ----
  - platform: template
    name: "${upper_devicename} Boot Temp DHT22"
    id: boot_temp_dht
    lambda: "return id(first_dht);"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Boot Temp SCD41"
    id: boot_temp_scd
    lambda: "return id(first_scd);"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Boot Temp SEN55"
    id: boot_temp_sen
    lambda: "return id(first_sen);"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s

  # ---- steady-state (30 min) temperatures ----
  - platform: template
    name: "${upper_devicename} Warm Temp DHT22"
    id: warm_temp_dht
    lambda: "return id(warm_dht);"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Warm Temp SCD41"
    id: warm_temp_scd
    lambda: "return id(warm_scd);"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Warm Temp SEN55"
    id: warm_temp_sen
    lambda: "return id(warm_sen);"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s

  # ---- measured self-heating rise: warm - boot, in the display's unit ----
  #  Add each of these to the matching "Bias ..." number in Home Assistant.
  #  They measure the rise on top of whatever bias is already applied, so
  #  after a correct calibration they should read ~0 on the next cold start.
  - platform: template
    name: "${upper_devicename} Bias Est DHT22"
    id: bias_est_dht
    unit_of_measurement: "°"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (!id(is_power_on_boot)) return NAN;
      float d = id(warm_dht) - id(first_dht);
      if (id(bias_unit_f)) d *= 1.8f;
      return d;

  - platform: template
    name: "${upper_devicename} Bias Est SCD41"
    id: bias_est_scd
    unit_of_measurement: "°"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (!id(is_power_on_boot)) return NAN;
      float d = id(warm_scd) - id(first_scd);
      if (id(bias_unit_f)) d *= 1.8f;
      return d;

  - platform: template
    name: "${upper_devicename} Bias Est SEN55"
    id: bias_est_sen
    unit_of_measurement: "°"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (!id(is_power_on_boot)) return NAN;
      float d = id(warm_sen) - id(first_sen);
      if (id(bias_unit_f)) d *= 1.8f;
      return d;

  - platform: template
    name: "${upper_devicename} Temperature Fused"
    id: temp_fused
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: 60s
    # All three sources arrive already corrected by their own filters,
    # so no bias term appears here.
    lambda: |-
      struct Src { esphome::sensor::Sensor *s; float sigma; };
      Src src[3] = {
        { id(Temperature), ${sigma_dht} },
        { id(scd_temp),    ${sigma_scd} },
        { id(sen_temp),    ${sigma_sen} },
      };

      float x[3], w[3]; bool ok[3]; int n = 0;
      for (int i = 0; i < 3; i++) {
        auto *s = src[i].s;
        ok[i] = s && s->has_state() && !std::isnan(s->state);
        if (!ok[i]) continue;
        x[i] = s->state;
        w[i] = 1.0f / (src[i].sigma * src[i].sigma);
        n++;
      }
      if (n == 0) { id(g_n) = 0; return NAN; }

      auto fit = [&]() {
        float sw = 0, swx = 0;
        for (int i = 0; i < 3; i++) if (ok[i]) { sw += w[i]; swx += w[i] * x[i]; }
        return std::make_pair(swx / sw, sw);
      };
      auto r = fit();
      float mu = r.first, sw = r.second;

      // reject one gross outlier, but only with all three alive
      if (n == 3) {
        int drop = -1; float worst = ${outlier_k};
        for (int i = 0; i < 3; i++) {
          float z = fabsf(x[i] - mu) / src[i].sigma;
          if (z > worst) { worst = z; drop = i; }
        }
        if (drop >= 0) {
          ESP_LOGW("fuse", "sensor %d rejected: %.2f C, z=%.1f", drop, x[drop], worst);
          ok[drop] = false; n--;
          r = fit(); mu = r.first; sw = r.second;
        }
      }

      float chi2 = 0;
      for (int i = 0; i < 3; i++) if (ok[i]) chi2 += w[i] * (x[i]-mu) * (x[i]-mu);
      id(g_chi2)  = (n > 1) ? chi2 / (n - 1) : 0.0f;
      id(g_sigma) = 1.0f / sqrtf(sw);
      id(g_n)     = n;
      return mu;

  - platform: copy
    source_id: temp_fused
    name: "${upper_devicename} Fused Temperature F"
    id: temp_fused_F
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    internal: true
    filters:
      - lambda: return x * 9.0 / 5.0 + 32.0;

  - platform: template
    name: "${upper_devicename} Temperature Fused Uncertainty"
    id: temp_fused_sigma
    lambda: "return id(g_sigma);"
    unit_of_measurement: "°C"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Sensor Agreement"
    id: temp_fused_chi2
    lambda: "return id(g_chi2);"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Humidity Fused"
    id: rh_fused
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      auto es = [](float t) { return 6.112f * expf(17.67f * t / (t + 243.5f)); };
      // live bias from the number entities, always returned as delta C
      auto nval = [](esphome::number::Number *n) -> float {
        if (n == nullptr || std::isnan(n->state)) return 0.0f;
        float b = n->state;
        if (id(bias_unit_f)) b /= 1.8f;
        return b;
      };

      // All three sensors now report RH referred to their own self-heated
      // temperature, because their offset registers are zeroed and the
      // correction happens in the temperature filters. So every source
      // needs the es() rescaling from sensor temperature back to ambient.
      struct Src {
        esphome::sensor::Sensor *rh;
        esphome::sensor::Sensor *t;
        float tbias; float rhbias; float sigma;
      };
      Src src[3] = {
        { id(Humidity),     id(Temperature), nval(id(bias_dht_num)), ${rhbias_dht}, ${sigma_dht_rh} },
        { id(scd_humidity), id(scd_temp),    nval(id(bias_scd_num)), ${rhbias_scd}, ${sigma_scd_rh} },
        { id(sen_hum),      id(sen_temp),    nval(id(bias_sen_num)), ${rhbias_sen}, ${sigma_sen_rh} },
      };

      float x[3], w[3], sg[3]; bool ok[3]; int n = 0;
      for (int i = 0; i < 3; i++) {
        auto *s = src[i].rh;
        ok[i] = s && s->has_state() && !std::isnan(s->state);
        if (!ok[i]) continue;

        // id(t)->state is ALREADY bias-corrected, i.e. ambient, so the
        // sensor's own temperature is (state + tbias).
        // Scale RH by es(T_sensor) / es(T_ambient).
        float f = 1.0f, sig = src[i].sigma;
        auto *ts = src[i].t;
        if (src[i].tbias != 0.0f) {
          if (ts && ts->has_state() && !std::isnan(ts->state)) {
            float tamb = ts->state;                     // ambient (corrected)
            f = es(tamb + src[i].tbias) / es(tamb);     // sensor / ambient
          } else {
            sig *= 2.0f;   // uncorrected: widen the error bar, don't drop it
          }
        }

        x[i] = s->state * f - src[i].rhbias;
        if (x[i] < 0.0f)   x[i] = 0.0f;
        if (x[i] > 100.0f) x[i] = 100.0f;

        sg[i] = sig * f;              // scaling RH scales its uncertainty too
        w[i]  = 1.0f / (sg[i] * sg[i]);
        n++;
      }
      if (n == 0) { id(g_rh_n) = 0; return NAN; }

      auto fit = [&]() {
        float sw = 0, swx = 0;
        for (int i = 0; i < 3; i++) if (ok[i]) { sw += w[i]; swx += w[i] * x[i]; }
        return std::make_pair(swx / sw, sw);
      };
      auto r = fit();
      float mu = r.first, sw = r.second;

      if (n == 3) {
        int drop = -1; float worst = ${rh_outlier_k};
        for (int i = 0; i < 3; i++) {
          float z = fabsf(x[i] - mu) / sg[i];
          if (z > worst) { worst = z; drop = i; }
        }
        if (drop >= 0) {
          ESP_LOGW("fuse_rh", "sensor %d rejected: %.1f %%RH, z=%.1f", drop, x[drop], worst);
          ok[drop] = false; n--;
          r = fit(); mu = r.first; sw = r.second;
        }
      }

      float chi2 = 0;
      for (int i = 0; i < 3; i++) if (ok[i]) chi2 += w[i] * (x[i]-mu) * (x[i]-mu);
      id(g_rh_chi2)  = (n > 1) ? chi2 / (n - 1) : 0.0f;
      id(g_rh_sigma) = 1.0f / sqrtf(sw);
      id(g_rh_n)     = n;
      return mu;

  - platform: template
    name: "${upper_devicename} Humidity Fused Uncertainty"
    id: rh_fused_sigma
    lambda: "return id(g_rh_sigma);"
    unit_of_measurement: "%"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Humidity Agreement"
    id: rh_fused_chi2
    lambda: "return id(g_rh_chi2);"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 60s

  - platform: template
    name: "${upper_devicename} Absolute Humidity"
    id: abs_humidity
    unit_of_measurement: "g/m³"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      const float mw = 18.01534f, r = 8.31447215f;
      float t = id(temp_fused).state, rh = id(rh_fused).state;
      if (std::isnan(t) || std::isnan(rh)) return NAN;
      float es = 6.112f * expf(17.67f * t / (t + 243.5f));
      return (es * rh * mw) / ((273.15f + t) * r);
    filters:
      - round: 1

  - platform: template
    name: "${upper_devicename} Dew Point"
    id: dew_point
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      float t = id(temp_fused).state, rh = id(rh_fused).state;
      if (std::isnan(t) || std::isnan(rh) || rh <= 0.0f) return NAN;
      float g = logf(rh / 100.0f) + (17.67f * t) / (t + 243.5f);
      return (243.5f * g) / (17.67f - g);
    filters:
      - round: 1

spi:
  clk_pin: GPIO18
  id: spi_a
  mosi_pin: GPIO23

output:
  - platform: ledc
    pin: GPIO32
    id: backlight_output

light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    pin: GPIO16
    num_leds: 1
    rgb_order: GRB
    name: "${upper_devicename} Status LED"
    id: status_rgb
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    gamma_correct: 1.0

  - platform: monochromatic
    output: backlight_output
    name: "${upper_devicename} Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0

display:
  - platform: mipi_spi
    model: ST7789V
    invert_colors: true
    id: my_display
    spi_id: spi_a
    dc_pin: GPIO4
    cs_pin: GPIO5
    reset_pin: GPIO27
    dimensions:
      width: 240
      height: 320
    update_interval: never
    lambda: |-
      auto v = [](esphome::sensor::Sensor *s, int dec) -> std::string {
        if (s == nullptr || !s->has_state() || std::isnan(s->state)) return "--";
        char buf[16];
        snprintf(buf, sizeof(buf), "%.*f", dec, s->state);
        return std::string(buf);
      };
      auto pick = [&](esphome::sensor::Sensor *s, float mod, float high) -> Color {
        if (s == nullptr || !s->has_state() || std::isnan(s->state)) return id(c_dim);
        if (s->state >= high) return id(c_red);
        if (s->state >= mod)  return id(c_yellow);
        return id(c_green);
      };
      // Dense cell: label 10px at cy, value 27px at cy+11. Row pitch 40.
      auto cell = [&](int cx, int cy, const char *label,
                      esphome::sensor::Sensor *s, int dec, float mod, float high) {
        it.print(cx, cy, id(font_label), id(c_dim), TextAlign::TOP_CENTER, label);
        it.printf(cx, cy + 11, id(font_value), pick(s, mod, high),
                  TextAlign::TOP_CENTER, "%s", v(s, dec).c_str());
      };
      // Big cell: label 22px at cy, value 46px at cy+26.
      auto big = [&](int cx, int cy, const char *label,
                     esphome::sensor::Sensor *s, int dec, float mod, float high) {
        it.print(cx, cy, id(font_big_label), id(c_dim), TextAlign::TOP_CENTER, label);
        it.printf(cx, cy + 26, id(font_big), pick(s, mod, high),
                  TextAlign::TOP_CENTER, "%s", v(s, dec).c_str());
      };
      const int A = 60;    // left column centre
      const int B = 180;   // right column centre
      const int Y1 = 45;   // top row (big layouts)
      const int Y2 = 205;  // bottom row (big layouts)
      const int mode = id(mode_index);   // 0 = All 16, 1 = Rotating, 2 = Highlight

      // ---- temperature unit selection (fused sensor) ----
      // explicit casts: the two id() results are distinct derived types
      const bool use_f = id(use_fahrenheit).state;
      esphome::sensor::Sensor *t_sens = use_f
        ? static_cast<esphome::sensor::Sensor *>(id(temp_fused_F))
        : static_cast<esphome::sensor::Sensor *>(id(temp_fused));
      const char *t_label  = use_f ? "TEMP °F"      : "TEMP °C";
      const float t_mod    = use_f ? ${temp_mod_f}  : ${temp_mod_c};
      const float t_high   = use_f ? ${temp_high_f} : ${temp_high_c};

      it.fill(id(c_bg));

      if (mode == 2) {
        // ---------- Highlight: 4 key values, static ----------
        big(A, Y1, t_label,    t_sens,            1, t_mod,        t_high);
        big(B, Y1, "VOC",      id(sen_voc),       0, ${voc_mod},   ${voc_high});
        big(A, Y2, "CO2 ppm",  id(scd_co2),       0, ${co2_mod},   ${co2_high});
        big(B, Y2, "PM2.5 µg", id(pm_2_5),        1, ${pm25_mod},  ${pm25_high});
      } else if (mode == 1) {
        // ---------- Rotating: 4 values per screen ----------
        switch (id(page_index)) {
          case 0:
            big(A, Y1, t_label,    t_sens,          1, t_mod,       t_high);
            big(B, Y1, "RH %",     id(rh_fused),    0, ${rh_mod},   ${rh_high});
            big(A, Y2, "AH g/m³",  id(abs_humidity),1, ${ah_mod},   ${ah_high});
            big(B, Y2, "CO2 ppm",  id(scd_co2),     0, ${co2_mod},  ${co2_high});
            break;
          case 1:
            big(A, Y1, "PM1.0 µg", id(pm_1_0),      1, ${pm1_mod},  ${pm1_high});
            big(B, Y1, "PM2.5 µg", id(pm_2_5),      1, ${pm25_mod}, ${pm25_high});
            big(A, Y2, "PM4.0 µg", id(pm_4_0),      1, ${pm4_mod},  ${pm4_high});
            big(B, Y2, "PM10 µg",  id(pm_10_0),     1, ${pm10_mod}, ${pm10_high});
            break;
          case 2:
            big(A, Y1, "VOC",      id(sen_voc),     0, ${voc_mod},  ${voc_high});
            big(B, Y1, "NOx",      id(sen_nox),     0, ${nox_mod},  ${nox_high});
            big(A, Y2, "NO2 ppm",  id(mics_no2),    2, ${no2_mod},  ${no2_high});
            big(B, Y2, "CO ppm",   id(mics_co),     1, ${co_mod},   ${co_high});
            break;
          case 3:
            big(A, Y1, "H2 ppm",   id(mics_h2),     1, ${h2_mod},   ${h2_high});
            big(B, Y1, "EtOH ppm", id(mics_etoh),   1, ${etoh_mod}, ${etoh_high});
            big(A, Y2, "CH4 ppm",  id(mics_ch4),    0, ${ch4_mod},  ${ch4_high});
            big(B, Y2, "NH3 ppm",  id(mics_nh3),    1, ${nh3_mod},  ${nh3_high});
            break;
        }
        // ---------- page indicator dots ----------
        for (int i = 0; i < 4; i++) {
          int dx = 84 + i * 24;
          if (i == id(page_index)) {
            it.filled_circle(dx, 300, 5, id(c_accent));
          } else {
            it.filled_circle(dx, 300, 3, id(c_dot));
          }
        }
      } else {
        // ---------- All 16: dense. Rows pitched 40px from y=0. ----------
        cell(A,   0, t_label,     t_sens,          1, t_mod,        t_high);
        cell(B,   0, "RH %",      id(rh_fused),    0, ${rh_mod},    ${rh_high});
        cell(A,  40, "AH g/m³",   id(abs_humidity),1, ${ah_mod},    ${ah_high});
        cell(B,  40, "CO2 ppm",   id(scd_co2),     0, ${co2_mod},   ${co2_high});
        cell(A,  80, "PM1.0 µg",  id(pm_1_0),      1, ${pm1_mod},   ${pm1_high});
        cell(B,  80, "PM2.5 µg",  id(pm_2_5),      1, ${pm25_mod},  ${pm25_high});
        cell(A, 120, "PM4.0 µg",  id(pm_4_0),      1, ${pm4_mod},   ${pm4_high});
        cell(B, 120, "PM10 µg",   id(pm_10_0),     1, ${pm10_mod},  ${pm10_high});
        cell(A, 160, "VOC",       id(sen_voc),     0, ${voc_mod},   ${voc_high});
        cell(B, 160, "NOx",       id(sen_nox),     0, ${nox_mod},   ${nox_high});
        cell(A, 200, "NO2 ppm",   id(mics_no2),    2, ${no2_mod},   ${no2_high});
        cell(B, 200, "CO ppm",    id(mics_co),     1, ${co_mod},    ${co_high});
        cell(A, 240, "H2 ppm",    id(mics_h2),     1, ${h2_mod},    ${h2_high});
        cell(B, 240, "EtOH ppm",  id(mics_etoh),   1, ${etoh_mod},  ${etoh_high});
        cell(A, 280, "CH4 ppm",   id(mics_ch4),    0, ${ch4_mod},   ${ch4_high});
        cell(B, 280, "NH3 ppm",   id(mics_nh3),    1, ${nh3_mod},   ${nh3_high});
      }
